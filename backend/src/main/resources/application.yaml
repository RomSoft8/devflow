spring:
  application:
    name: backend

  datasource:
    url: jdbc:postgresql://localhost:5432/devflow_db
    username: devflow_user
    password: devflow_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true

server:
  port: 8080